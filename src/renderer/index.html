<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
    <title>Nimbus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Everything lives in the sky column on the left. The text floats to the
         right of it as a single card, with no chrome above it. -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand" title="Nimbus">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark">
            <path d="M6.5 15h11a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 5.6 4.2 4.2 0 0 0 6.5 15Z" />
            <path d="M8.6 17.4 7.4 20M12 17.4 10.8 20M15.4 17.4 14.2 20" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round" fill="none" />
          </svg>
          <span>Nimbus</span>
        </div>
      </div>

      <div class="tool-row">
        <button class="tool-btn" id="open" title="Open a file (Ctrl+O)" aria-label="Open a file">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V7a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z" /></svg>
        </button>
        <button class="tool-btn" id="save" title="Save (Ctrl+S)" aria-label="Save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h11l3 3v11H5z" /><path d="M8 5v5h7V5M8 19v-5h8v5" /></svg>
        </button>
        <button class="tool-btn" id="new" title="New sheet (Ctrl+N)" aria-label="New sheet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
        </button>
        <button class="tool-btn" id="find-open" title="Find (Ctrl+F)" aria-label="Find">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="M20 20l-4.3-4.3" /></svg>
        </button>

        <span class="tool-gap"></span>

        <button class="tool-btn" id="settings" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.7-1.3-1.9-3.3-2 .8a7.8 7.8 0 0 0-2.6-1.5L14.3 3H10.5l-.3 2.2a7.8 7.8 0 0 0-2.6 1.5l-2-.8L3.7 9.2l1.7 1.3a7.7 7.7 0 0 0 0 3l-1.7 1.3 1.9 3.3 2-.8a7.8 7.8 0 0 0 2.6 1.5l.3 2.2h3.8l.3-2.2a7.8 7.8 0 0 0 2.6-1.5l2 .8 1.9-3.3z" /></svg>
        </button>
        <button class="tool-btn" id="theme" title="Dusk" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" /></svg>
        </button>
      </div>

      <div class="sheet-list" id="sheet-list"></div>

      <div class="foot" id="foot">1 sheet</div>
    </aside>

    <main class="main">
      <!-- Find, and replace when it is asked for. Sits above the text rather
           than over it, so nothing it covers is text you are looking at. -->
      <div class="drawer find-bar" id="find-bar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="drawer-icon"><circle cx="11" cy="11" r="6" /><path d="M20 20l-4.3-4.3" /></svg>
        <input id="find-what" type="text" placeholder="Find" spellcheck="false" autocomplete="off" aria-label="Find" />
        <span class="find-count" id="find-count"></span>
        <button class="pill-btn ghost" id="find-prev" title="Previous (Shift+F3)" aria-label="Previous match">↑</button>
        <button class="pill-btn ghost" id="find-next" title="Next (F3)" aria-label="Next match">↓</button>

        <!-- Only in Smart Mode: the switches you need to know what they mean. -->
        <span class="find-smart" id="find-smart" hidden>
          <button class="chip" id="find-case" title="Match case" aria-pressed="false">Aa</button>
          <button class="chip" id="find-word" title="Whole word" aria-pressed="false">ab|</button>
          <button class="chip" id="find-regex" title="Regular expression" aria-pressed="false">.*</button>
        </span>

        <button class="pill-btn ghost" id="find-toggle-replace" title="Replace (Ctrl+H)">Replace</button>
        <button class="pill-btn ghost" id="find-close" title="Close (Esc)" aria-label="Close find">✕</button>
      </div>

      <div class="drawer find-bar replace-row" id="replace-bar" hidden>
        <span class="drawer-icon"></span>
        <input id="replace-with" type="text" placeholder="Replace with" spellcheck="false" autocomplete="off" aria-label="Replace with" />
        <button class="pill-btn ghost" id="replace-one">Replace</button>
        <button class="pill-btn primary" id="replace-all">Replace all</button>
      </div>

      <div class="stage" id="stage">
        <div class="rule" id="rule">1</div>
        <div class="paper-wrap">
          <!-- Behind the text: the line the caret is on, and every find match. -->
          <div class="marks" id="marks" aria-hidden="true"></div>
          <textarea class="paper" id="paper" spellcheck="false" autocomplete="off"
                    autocapitalize="off" autocorrect="off" aria-label="The text"></textarea>
          <!-- Never shown. Used to measure how many rows a wrapped line takes,
               so the numbers on the rule stay level with the lines. -->
          <div class="mirror" id="mirror" aria-hidden="true"></div>
        </div>
      </div>

      <div class="status">
        <span id="where">Line 1, column 1</span>
        <span id="selected"></span>
        <span class="status-gap"></span>
        <span class="status-smart" id="status-smart" hidden>
          <button class="status-btn" id="encoding" title="How the file is encoded">UTF-8</button>
          <button class="status-btn" id="line-endings" title="How lines end">LF</button>
        </span>
        <span id="counts">0 words</span>
      </div>
    </main>

    <!-- Ctrl+Shift+P. Everything the program can do, by name. -->
    <div class="overlay" id="palette-overlay" hidden>
      <div class="palette" id="palette" role="dialog" aria-label="Find a command">
        <input id="palette-input" type="text" placeholder="What would you like to do?"
               spellcheck="false" autocomplete="off" aria-label="Find a command" />
        <div class="palette-list" id="palette-list"></div>
        <p class="palette-note" id="palette-note"></p>
      </div>
    </div>

    <!-- Right-clicking the text. The browser's own menu is turned off, so this
         is the only one; it holds what you would expect and nothing clever. -->
    <div class="context" id="context" hidden role="menu"></div>

    <!-- Anything that has to be answered before carrying on: unsaved work,
         where to jump to. Never a native dialog, which cannot be themed. -->
    <div class="overlay" id="ask-overlay" hidden>
      <div class="ask" id="ask" role="dialog" aria-modal="true">
        <h2 id="ask-title"></h2>
        <p id="ask-body"></p>
        <input id="ask-input" type="text" spellcheck="false" autocomplete="off" hidden />
        <div class="ask-row" id="ask-row"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="../shared/theme.js"></script>
    <script src="../shared/clouds.js"></script>
    <script src="../shared/commands.js"></script>
    <script src="../shared/edits.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
