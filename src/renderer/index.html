<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
    <title>Nimbus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Everything lives in the sky column on the left. The text floats to the
         right of it as a single card, with no chrome above it. -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand" title="Nimbus">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark">
            <path d="M6.5 15h11a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 5.6 4.2 4.2 0 0 0 6.5 15Z" />
            <path d="M8.6 17.4 7.4 20M12 17.4 10.8 20M15.4 17.4 14.2 20" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round" fill="none" />
          </svg>
          <span>Nimbus</span>
        </div>
      </div>

      <div class="tool-row">
        <button class="tool-btn" id="open" title="Open a file (Ctrl+O)" aria-label="Open a file">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V7a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z" /></svg>
        </button>
        <button class="tool-btn" id="save" title="Save (Ctrl+S)" aria-label="Save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h11l3 3v11H5z" /><path d="M8 5v5h7V5M8 19v-5h8v5" /></svg>
        </button>
        <button class="tool-btn" id="new" title="New sheet (Ctrl+N)" aria-label="New sheet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
        </button>

        <span class="tool-gap"></span>

        <button class="tool-btn" id="theme" title="Dusk" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" /></svg>
        </button>
      </div>

      <div class="sheet-list" id="sheet-list"></div>

      <div class="foot" id="foot">1 sheet</div>
    </aside>

    <main class="main">
      <div class="stage">
        <div class="rule" id="rule">1</div>
        <textarea class="paper" id="paper" spellcheck="false" autocomplete="off"
                  aria-label="The text"></textarea>
      </div>
      <div class="status">
        <span id="where">Line 1, column 1</span>
        <span class="status-gap"></span>
        <span id="counts">0 words</span>
      </div>
    </main>

    <script src="../shared/theme.js"></script>
    <script src="../shared/clouds.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
